<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Aplica o tema salvo antes da renderização para evitar piscar o tema errado.
      (function () {
        var theme = 'dark'
        try { if (localStorage.getItem('theme') === 'light') theme = 'light' } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
      })()
    </script>
    <meta name="description" content="Livia.Dev — portfólio em construção sobre desenvolvimento, inteligência artificial e automações." />
    <meta property="og:title" content="Livia.Dev — Portfólio" />
    <meta property="og:description" content="Tecnologia com intenção. Conheça a estrutura inicial do portfólio Livia.Dev." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <title>Livia.Dev — Portfólio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
